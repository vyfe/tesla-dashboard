<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e13" />
    <link rel="icon" href="/favicon.ico" />
    <title>Tesla 数据看板</title>
    <script>
      // 在首帧之前定好主题，避免深色模式闪一下白。
      (function () {
        try {
          var query = new URLSearchParams(window.location.search).get("theme");
          var mode =
            query === "light" || query === "dark"
              ? query
              : localStorage.getItem("tesla-dashboard-theme") || "auto";
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = mode === "auto" ? (dark ? "dark" : "light") : mode;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
